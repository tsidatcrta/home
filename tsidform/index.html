<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - จัดการสิทธิ์การเปิด/ปิดชุดฟอร์ม</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ซ่อน Scrollbar แนวนอนเพื่อให้ดูสะอาดตาแต่เลื่อนได้ */
    .table-container::-webkit-scrollbar { height: 8px; }
    .table-container::-webkit-scrollbar-track { background: #f1f5f9; }
    .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">ระบบจัดการสิทธิ์ชุดแบบฟอร์ม</h1>
        <p class="text-sm text-slate-500 mt-1">กำหนดสิทธิ์การเข้าถึงชุดตารางสอบถาม (A100, A200, B400...) รายหน่วยงาน</p>
      </div>
      <!-- Status Toast / Activity Indicator -->
      <div id="save-status" class="hidden items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 border border-emerald-200">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        บันทึกข้อมูลเรียบร้อย
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="w-full sm:w-80">
        <input 
          type="text" 
          id="search-input" 
          placeholder="ค้นหารหัส หรือชื่อหน่วยงาน..." 
          class="w-full px-3.5 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm"
        >
      </div>
      <div class="text-xs text-slate-500">
        * ระบบบันทึกอัตโนมัติทันทีที่มีการติ๊กเลือก
      </div>
    </div>

    <!-- Data Table Matrix -->
    <div class="mt-4 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="table-container overflow-x-auto max-h-[70vh]">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="bg-slate-100 sticky top-0 z-10 border-b border-slate-200 text-slate-700">
            <tr id="table-header-row">
              <th class="p-3.5 font-semibold w-28 bg-slate-100 sticky left-0 z-20 shadow-[1px_0_0_0_#e2e8f0]">รหัสหน่วย</th>
              <th class="p-3.5 font-semibold min-w-[220px] bg-slate-100 sticky left-28 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">ชื่อหน่วยงาน</th>
              <!-- Form Columns จะถูก Render ไดนามิกตรงนี้ -->
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 text-slate-600">
            <!-- Loading Indicator -->
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">กำลังโหลดโครงสร้างข้อมูลหน่วยงานและแบบฟอร์ม...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 1. ตั้งค่าการเชื่อมต่อ Supabase (แทนที่ด้วยค่าจริงของพี่แม็กซ์)
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_OR_SERVICE_ROLE_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let unitsData = [];
    let formsData = [];
    let assignmentsMap = new Map(); // Key: `${unit_code}_${form_code}` -> boolean

    // 2. เริ่มต้นโหลดข้อมูล Master Data
    async function init() {
      try {
        // ดึงฟอร์มทั้งหมด จัดเรียงตาม Form Code
        const { data: forms, error: formErr } = await supabaseClient
          .from('forms')
          .select('*')
          .order('form_code', { ascending: true });

        // ดึง 300 หน่วยงาน
        const { data: units, error: unitErr } = await supabaseClient
          .from('units')
          .select('unit_code, unit_name')
          .order('unit_code', { ascending: true });

        // ดึงข้อมูลสิทธิ์เดิมที่มีอยู่
        const { data: assignments, error: assignErr } = await supabaseClient
          .from('unit_form_assignments')
          .select('unit_code, form_code, is_enabled');

        if (formErr || unitErr || assignErr) throw formErr || unitErr || assignErr;

        formsData = forms || [];
        unitsData = units || [];

        // ทำ Indexing เพื่อง่ายต่อการ lookup ค่า Checkbox
        (assignments || []).forEach(row => {
          assignmentsMap.set(`${row.unit_code}_${row.form_code}`, row.is_enabled);
        });

        renderHeaders();
        renderTableRows(unitsData);

      } catch (err) {
        console.error("Data Load Error:", err);
        document.getElementById('table-body').innerHTML = `
          <tr><td colspan="6" class="p-8 text-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</td></tr>
        `;
      }
    }

    // 3. Render คอลัมน์หัวตาราง (มีปุ่ม Select All ของแต่ละคอลัมน์)
    function renderHeaders() {
      const headerRow = document.getElementById('table-header-row');
      
      formsData.forEach(form => {
        const th = document.createElement('th');
        th.className = "p-3.5 font-semibold text-center min-w-[130px] border-l border-slate-200";
        th.innerHTML = `
          <div class="flex flex-col items-center gap-1">
            <span class="inline-block px-2 py-0.5 text-xs font-bold rounded ${form.category === 'A' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
              ${form.form_code}
            </span>
            <span class="text-[11px] font-normal text-slate-500 truncate max-w-[110px]" title="${form.form_name}">${form.form_name}</span>
            <button 
              onclick="toggleEntireColumn('${form.form_code}')"
              class="text-[10px] text-blue-600 hover:text-blue-800 underline mt-0.5 font-normal">
              สลับทั้งหมด
            </button>
          </div>
        `;
        headerRow.appendChild(th);
      });
    }

    // 4. Render แถวข้อมูลรายหน่วยงาน
    function renderTableRows(units) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (units.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${formsData.length + 2}" class="p-8 text-center text-slate-400">ไม่พบหน่วยงานที่ตรงกับคำค้นหา</td></tr>`;
        return;
      }

      units.forEach(unit => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/80 transition-colors";

        // Sticky คอลัมน์รหัสและชื่อหน่วยงาน
        let rowHtml = `
          <td class="p-3.5 font-mono text-xs font-medium text-slate-700 bg-white sticky left-0 z-10 shadow-[1px_0_0_0_#e2e8f0]">${unit.unit_code}</td>
          <td class="p-3.5 font-medium text-slate-900 bg-white sticky left-28 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] truncate max-w-[240px]" title="${unit.unit_name}">${unit.unit_name}</td>
        `;

        // Checkbox แต่ละฟอร์ม
        formsData.forEach(form => {
          const key = `${unit.unit_code}_${form.form_code}`;
          const isChecked = assignmentsMap.get(key) === true;

          rowHtml += `
            <td class="p-3 text-center border-l border-slate-100">
              <input 
                type="checkbox" 
                data-unit="${unit.unit_code}" 
                data-form="${form.form_code}" 
                ${isChecked ? 'checked' : ''}
                onchange="handleCheckboxToggle(this, '${unit.unit_code}', '${form.form_code}')"
                class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 focus:ring-offset-0 cursor-pointer"
              >
            </td>
          `;
        });

        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
      });
    }

    // 5. บันทึกการเปลี่ยนสถานะแบบ Real-time (Auto-save บน Supabase)
    async function handleCheckboxToggle(checkbox, unitCode, formCode) {
      const isEnabled = checkbox.checked;
      const key = `${unitCode}_${formCode}`;
      assignmentsMap.set(key, isEnabled);

      try {
        // ใช้ Upsert ป้องกันแถวซ้ำ
        const { error } = await supabaseClient
          .from('unit_form_assignments')
          .upsert({
            unit_code: unitCode,
            form_code: formCode,
            is_enabled: isEnabled,
            updated_at: new Date().toISOString()
          }, { onConflict: 'unit_code, form_code' });

        if (error) throw error;
        showToast("บันทึกข้อมูลเรียบร้อย");
      } catch (err) {
        console.error("Save Error:", err);
        checkbox.checked = !isEnabled; // Revert checkbox กลับถ้าบันทึกล้มเหลว
        assignmentsMap.set(key, !isEnabled);
        alert("ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่อีกครั้ง");
      }
    }

    // 6. ฟังก์ชันสลับเปิด/ปิดทั้งคอลัมน์ (Batch Operation)
    async function toggleEntireColumn(formCode) {
      if (!confirm(`คุณต้องการสลับสถานะเปิด/ปิดของชุดฟอร์ม ${formCode} สำหรับทุกหน่วยงานใช่หรือไม่?`)) return;

      // ตรวจสอบสถานะส่วนใหญ่ว่าเปิดอยู่หรือปิดอยู่
      let currentlyEnabledCount = 0;
      unitsData.forEach(u => {
        if (assignmentsMap.get(`${u.unit_code}_${formCode}`) === true) currentlyEnabledCount++;
      });

      // ถ้าเปิดอยู่เกินครึ่ง ให้คำสั่งเป็นการ "ปิดทั้งหมด" ถ้าปิดอยู่ให้ "เปิดทั้งหมด"
      const targetState = currentlyEnabledCount < (unitsData.length / 2);

      const batchPayload = unitsData.map(u => ({
        unit_code: u.unit_code,
        form_code: formCode,
        is_enabled: targetState,
        updated_at: new Date().toISOString()
      }));

      try {
        const { error } = await supabaseClient
          .from('unit_form_assignments')
          .upsert(batchPayload, { onConflict: 'unit_code, form_code' });

        if (error) throw error;

        // อัปเดต Map และ UI
        unitsData.forEach(u => assignmentsMap.set(`${u.unit_code}_${formCode}`, targetState));
        renderTableRows(unitsData);
        showToast(`อัปเดต ${formCode} ทั้งหมดเรียบร้อยแล้ว`);
      } catch (err) {
        console.error("Batch update failed:", err);
        alert("เกิดข้อผิดพลาดในการอัปเดตชุดข้อมูล");
      }
    }

    // 7. ระบบค้นหา Real-time ค้นหารหัสหรือชื่อหน่วยงาน
    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = unitsData.filter(u => 
        u.unit_code.toLowerCase().includes(query) || 
        u.unit_name.toLowerCase().includes(query)
      );
      renderTableRows(filtered);
    });

    // แจ้งเตือน Toast เล็กๆ มุมขวาบน
    function showToast(text) {
      const toast = document.getElementById('save-status');
      toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${text}`;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.classList.remove('flex');
      }, 2500);
    }

    // รันตอนโหลดหน้าเว็บ
    init();
  </script>
</body>
</html>
